[project]
name = "buyerintel"
version = "0.1.0"
description = "Calendula Buyer Intel - personal buyer and market intelligence system for Calendula Herbs Group"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rapidfuzz>=3.0",
    "phonenumbers>=8.13",
    "email-validator>=2.0",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "pytrends>=4.9.2",
    "streamlit>=1.67.0",
]

[project.scripts]
buyerintel = "buyerintel.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buyerintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
