# Market module configuration (spec section 15 / milestone M2).
# All sources are free. HTTP is polite: cached, rate-limited, retried with
# backoff, and routed through the egress policy in network.yaml (direct by
# default, never a Tor exit node).
comtrade:
  base_url: https://comtradeapi.un.org/public/v1/preview
  egypt_reporter_code: "818"
  flow_codes: ["X", "M"]      # X = Egypt exports, M = Egypt imports; both in one call (csv)
  years: [2023, 2024, 2025]   # rolling window; scheduler refreshes. ONE period per call
  inter_call_seconds: 1.2     # preview API throttles ~1 req/s with a silent 429
  max_calls_per_run: 40       # 500 rows/call cap; dedupe handled in code
  # UN numeric partner code -> ISO alpha-3 stored in trade_flow.partner
  partners:
    "0": WLD
    "842": USA
    "156": CHN
    "124": CAN
    "276": DEU
    "528": NLD
    "250": FRA
    "826": GBR
    "380": ITA
    "724": ESP
    "792": TUR
    "682": SAU
    "784": ARE
    "392": JPN
    "699": IND
    "76": BRA
    "484": MEX
    "36": AUS
    "616": POL
    "56": BEL

comext:
  # Dedicated Comext endpoint (NOT the main Eurostat base - the /comext/ path
  # segment is required for DS- datasets).
  base_url: https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data
  dataset: DS-045409          # EU trade since 1988 by HS2-4-6 and CN8
  reporter: EU27_2020
  partner: EG                 # Egypt (Eurostat 2-letter code)
  import_flow: "1"
  export_flow: "2"
  indicators:
    value: VALUE_IN_EUROS
    qty: QUANTITY_IN_100KG    # x100 = kg
  currency: EUR               # converted to USD at ingestion using the FX signal

fx:
  # Frankfurter moved from api.frankfurter.app to api.frankfurter.dev (301).
  # ECB reference currencies only - EGP is NOT one; it gets a dedicated source later.
  base_url: https://api.frankfurter.dev/v1/latest
  base: USD
  currencies: [EUR, CNY, GBP]

pubmed:
  base_url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi
  rate_limit_seconds: 0.5     # NCBI allows 3 req/s without an API key

trends:
  enabled: true               # pytrends occasionally breaks; failures are logged, not fatal
  timeframe: "today 5-y"
  months_back: 12
