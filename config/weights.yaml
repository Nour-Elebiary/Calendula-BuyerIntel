# Scoring weights v2 (docs/Calendula Herbs Group Buyer & Purchaser Personas.md,
# section 9 "Suggested score components"). Supersedes spec section 13's v1 weights
# per the additions precedence. Total must be 100.
# Versioned: score_run stores weights_version; auto-tuning creates new versions.
version: 2
weights:
  persona_fit_product_overlap: 35   # persona fit + product overlap with the 42 SKUs
  scale_buying_frequency: 25        # importer vs small trader, repeat vs spot
  certification_alignment: 15       # organic, BRCGS, ISO 22000, HALAL, KOSHER, FDA
  reachability: 15                  # named decision maker, verified email/phone, social
  timing_signals: 10                # recent imports, expo attendance, launches, supplier changes

tier_thresholds:
  tier1:
    min_total: 70
    min_product_fit: 14   # 40% of the 35-point product-overlap component
  tier2:
    min_total: 45
    max_total: 69
  tier3:
    max_total: 44
